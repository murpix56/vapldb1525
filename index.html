@font-face{font-family:'Inter';font-weight:400;font-style:normal;font-display:swap;src:url(inter-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:500;font-style:normal;font-display:swap;src:url(inter-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:600;font-style:normal;font-display:swap;src:url(inter-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-weight:700;font-style:normal;font-display:swap;src:url(inter-latin-700-normal.woff2) format('woff2')}

/* Layout: columna de iPhone (máx. 430px) que calca el lienzo aprobado (portada 1B/1C, ficha 7, búsqueda 2, ajustes 6); menú inferior fijo. */
:root{
  --bg:#F4F6FA; --card:#FFFFFF; --line:#E3E8F0; --tile:#F1F4F9;
  --fg:#0F2A4A; --fg2:#5B6472; --brand:#0F2A4A; --icon:#0F2A4A; --link:#1D4E9E; --code:#1D4E9E; --yel:#F5C542; --ink:#0A1628;
  --sBorder:#D5DDEA; --sShadow:0 8px 24px rgba(15,42,74,.10);
  --chipT:#0F2A4A; --chipB:#C9D4E5; --chipBg:#FFFFFF;
  --featBg:#0F2A4A; --featT:#FFFFFF; --featL:#F5C542; --featBtnBg:#F5C542; --featBtnT:#0F2A4A;
  --iTile:#0F2A4A; --iOn:#FFFFFF; --btnSoft:#E3ECF8; --btnSoftT:#0F2A4A; --seg:#EEF1F5; --segOn:#FFFFFF;
  --nav:#FFFFFF; --navB:#E0E4EA; --navOn:#0F2A4A; --navOff:#6B7280;
  --mgT:#B42318; --mgB:#FBDDDA; --gT:#8A4A00; --gB:#FDE7CF; --lT:#1B4F8F; --lB:#DCE8F7; --nT:#4A5568; --nB:#E6E9EF; --mark:#FFE89A;
  --sans:"Inter",-apple-system,"Segoe UI",Roboto,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1628; --card:#13223A; --line:#1E3253; --tile:#1B2D4A; --fg:#FFFFFF; --fg2:#A9B8CE; --brand:#F5C542; --icon:#F5C542; --link:#F5C542; --code:#F5C542;
  --sBorder:#FFFFFF; --sShadow:0 10px 30px rgba(0,0,0,.35); --chipT:#DCE5F2; --chipB:#2A3F63; --chipBg:transparent;
  --featBg:#F5C542; --featT:#0A1628; --featL:#0A1628; --featBtnBg:#0A1628; --featBtnT:#F5C542;
  --iTile:#F5C542; --iOn:#0A1628; --btnSoft:#1E3253; --btnSoftT:#F5C542; --seg:#13223A; --segOn:#1E3253;
  --nav:#0D1B30; --navB:#1C2E4C; --navOn:#F5C542; --navOff:#8FA2BE;
  --mgT:#FF8A8A; --mgB:#4A1A22; --gT:#FFC86B; --gB:#3D2E12; --lT:#8DB8FF; --lB:#14305A; --nT:#C9D3E2; --nB:#2A3A55; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1628; --card:#13223A; --line:#1E3253; --tile:#1B2D4A; --fg:#FFFFFF; --fg2:#A9B8CE; --brand:#F5C542; --icon:#F5C542; --link:#F5C542; --code:#F5C542;
  --sBorder:#FFFFFF; --sShadow:0 10px 30px rgba(0,0,0,.35); --chipT:#DCE5F2; --chipB:#2A3F63; --chipBg:transparent;
  --featBg:#F5C542; --featT:#0A1628; --featL:#0A1628; --featBtnBg:#0A1628; --featBtnT:#F5C542;
  --iTile:#F5C542; --iOn:#0A1628; --btnSoft:#1E3253; --btnSoftT:#F5C542; --seg:#13223A; --segOn:#1E3253;
  --nav:#0D1B30; --navB:#1C2E4C; --navOn:#F5C542; --navOff:#8FA2BE;
  --mgT:#FF8A8A; --mgB:#4A1A22; --gT:#FFC86B; --gB:#3D2E12; --lT:#8DB8FF; --lB:#14305A; --nT:#C9D3E2; --nB:#2A3A55; color-scheme:dark}
.only-dark{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .only-dark{display:block}:root:not([data-theme="light"]) .only-light{display:none}}
:root[data-theme="dark"] .only-dark{display:block}:root[data-theme="dark"] .only-light{display:none}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:430px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(100px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--link);outline-offset:2px}
h1,h2,h3,p{margin:0}
.col{display:flex;flex-direction:column}
.g8{gap:8px}.g10{gap:10px}.g14{gap:14px}.g16{gap:16px}
.sec{font-size:13px;font-weight:700;color:var(--fg2);text-transform:uppercase;letter-spacing:.08em;margin:0 2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px}
.pad{padding:14px 16px}
.brandrow{display:flex;align-items:center;gap:12px}
.brandrow img{width:54px;height:auto;flex:none}
.brand{font-size:22px;font-weight:800;color:var(--brand);letter-spacing:.14em;line-height:1}
.hello span{font-size:15px;color:var(--fg2)} .hello h1{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.sbox{display:flex;align-items:center;gap:12px;background:#FFFFFF;border:1px solid var(--sBorder);border-radius:18px;height:54px;padding:0 10px 0 16px;box-shadow:var(--sShadow)}
.sbox input{border:0;outline:0;font:inherit;font-size:17px;flex:1;min-width:0;background:transparent;color:#111827}
.sbox input::placeholder{color:#6B7280}
.mic{width:34px;height:34px;border-radius:10px;background:var(--yel);display:flex;align-items:center;justify-content:center;flex:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.fi{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:10px 12px;font:inherit;font-size:15px}
textarea.fi{resize:vertical;line-height:1.5}
.save{background:var(--yel);color:#0A1628;font-weight:800;font-size:16px;border-radius:14px;padding:14px;width:100%}
.hl{flex:none;width:32px;height:32px;border-radius:10px;background:var(--lB);color:var(--lT);font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center}
.tm{flex:none;display:flex;flex-direction:column;gap:1px;align-items:flex-end;font-size:12px;color:var(--fg2)}.tm b{font-size:15px;font-weight:800;color:var(--fg);font-variant-numeric:tabular-nums}.tm b.f{color:var(--mgT)}
.hr2{display:grid;grid-template-columns:1fr auto auto;gap:6px 14px;align-items:center}.hr2 .hh{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--fg2)}.hr2 .v{font-size:17px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}.hr2 .v.f{color:var(--mgT)}
.pill{display:flex;background:var(--seg);border:1px solid var(--line);border-radius:12px;padding:2px;gap:2px}.pill button{width:42px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--fg2)}.pill button.on{background:var(--segOn);color:var(--fg);box-shadow:0 1px 3px rgba(15,42,74,.15)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:6px 0}.setrow+.setrow{border-top:1px solid var(--line)}.setrow .t{font-size:15px;font-weight:500}.setrow .d{font-size:12.5px;color:var(--fg2)}
#app{zoom:var(--z,1)}
.ty{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:2px 7px}
.ty-j{color:var(--lT);background:var(--lB)}.ty-a{color:var(--nT);background:var(--nB)}.ty-e{color:#0A1628;background:var(--yel)}.ty-s{color:var(--gT);background:var(--gB)}.ty-d{color:var(--nT);background:var(--nB);border:1px solid var(--line)}
#pager{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));z-index:30;display:flex;align-items:center;gap:2px;background:var(--iTile);color:var(--iOn);border-radius:22px;padding:3px;box-shadow:0 4px 14px rgba(10,22,40,.28);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}#pager span{padding:0 8px;min-width:58px;text-align:center}#pager button{width:36px;height:34px;border-radius:17px;font-size:22px;line-height:30px;color:inherit}#pager button:disabled{opacity:.3}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--brand);transition:width .3s}
.lb{position:fixed;inset:0;z-index:100;background:rgba(5,10,20,.97);overflow:auto;-webkit-overflow-scrolling:touch}.lb img{display:block;width:100%;height:auto;touch-action:pan-x pan-y pinch-zoom}.lb.z img{width:240%}.lb .x{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;width:40px;height:40px;border-radius:20px;background:rgba(255,255,255,.18);color:#fff;font-size:22px;line-height:40px;text-align:center;z-index:101}.lb .h{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#fff;font-size:12px;opacity:.7;pointer-events:none}
.pgs{display:flex;flex-direction:column;gap:10px}.pgs img{width:100%;border-radius:12px;border:1px solid var(--line);background:#fff}
.add{border:1.5px dashed var(--line);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;width:100%;text-align:left;color:var(--fg)}
.add b{display:block;font-size:15px}.add span.s{font-size:12.5px;color:var(--fg2)}.add .pl{flex:none;width:34px;height:34px;border-radius:10px;background:var(--yel);color:#0A1628;font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center}
details.card summary{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--fg2);cursor:pointer}
.chip{font-size:13px;font-weight:600;color:var(--chipT);border:1px solid var(--chipB);background:var(--chipBg);border-radius:16px;padding:6px 12px}
.feat{background:var(--featBg);border-radius:18px;padding:12px 16px;display:flex;align-items:center;gap:12px;color:var(--featT);width:100%}
.feat .l{font-size:10.5px;font-weight:800;letter-spacing:.12em;color:var(--featL)}
.feat strong{font-size:16px;font-weight:800;line-height:1.25}
.feat .b{flex:none;font-size:13px;font-weight:700;color:var(--featBtnT);background:var(--featBtnBg);border-radius:12px;padding:8px 12px}
.trf{padding:14px;display:flex;flex-direction:column;gap:12px}
.trrow{display:flex;align-items:center;gap:12px;width:100%}
.itile{width:40px;height:40px;border-radius:12px;background:var(--iTile);display:flex;align-items:center;justify-content:center;flex:none}
.normas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.norma{background:var(--tile);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:48px}
.norma strong{font-size:14px;font-weight:800;color:var(--code);letter-spacing:.02em}
.norma span{font-size:10.5px;font-weight:500;color:var(--fg2);white-space:nowrap}
.blocks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.blk{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:68px}
.blk strong{font-size:13px;font-weight:700;line-height:1.2}
.blk.off{opacity:.5}
.blk small{font-size:11px;color:var(--fg2)}
.top{display:flex;justify-content:space-between;align-items:center;min-height:44px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;margin-top:-8px}
.back{color:var(--link);font-size:16px;font-weight:500;display:flex;align-items:center;gap:2px;min-height:44px}
.icb{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0 2px}
.shead{display:flex;flex-direction:column;gap:12px}
.sbar{display:flex;align-items:center;gap:10px}
.sfield{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--seg);border:1px solid var(--line);border-radius:12px;height:44px;padding:0 12px}
.sfield input{border:0;outline:0;font:inherit;font-size:16px;flex:1;min-width:0;background:transparent;color:var(--fg)}
.clr{background:#A3ABB7;width:18px;height:18px;border-radius:9px;color:#FFFFFF;font-size:11px;line-height:18px;text-align:center;flex:none}
.cancel{flex:none;font-size:16px;font-weight:500;color:var(--link);min-height:44px}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.filters::-webkit-scrollbar{display:none}
.fl{font-size:12.5px;font-weight:500;color:var(--fg2);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px 11px;white-space:nowrap}
.fl.on{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
.lst{background:var(--card);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
.row{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;align-items:center}
.row:last-child{border-bottom:0}
.row .b{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;border-radius:5px;padding:2px 6px;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.t-mg{color:var(--mgT);background:var(--mgB)}.t-g{color:var(--gT);background:var(--gB)}.t-l{color:var(--lT);background:var(--lB)}.t-n{color:var(--nT);background:var(--nB)}.t-p{color:var(--ink);background:var(--yel)}
.ref{font-size:12px;color:var(--fg2)}
.ht{font-size:15px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ht mark{background:var(--mark);color:#111827;border-radius:3px;padding:0 2px}
.amt{font-size:13px;font-weight:600;color:var(--fg2);font-variant-numeric:tabular-nums}
.chev{flex:none;color:var(--fg2)}
.cvg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cv{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0}
.cv img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top;background:var(--seg);display:block}
.cvt{padding:10px 11px 12px;display:flex;flex-direction:column;gap:6px}.cvt strong{font-size:13.5px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.thumb.tp{width:46px;height:62px;background-size:cover;background-position:top}
.thumb{width:64px;height:42px;border-radius:8px;background:#fff center/contain no-repeat;flex:none;border:1px solid var(--line)}
.more{width:100%;padding:12px;font-weight:600;font-size:14px;color:var(--link);text-align:center}
.empty{text-align:center;color:var(--fg2);padding:30px 10px;font-size:14px}
.code{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:.01em}
.badge{font-size:11px;font-weight:800;letter-spacing:.06em;border-radius:6px;padding:4px 8px;text-transform:uppercase}
.badge.o{font-weight:700;color:var(--fg2);border:1px solid var(--line);padding:3px 8px;text-transform:none;letter-spacing:0}
.prec{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:16px 4px 14px}
.prec div{display:flex;flex-direction:column;align-items:center;gap:4px}
.prec div+div{border-left:1px solid var(--line)}
.prec strong.lg{font-size:16px;line-height:1.25;text-align:center;word-break:break-word}
.prec span{font-size:12px;color:var(--fg2);font-weight:500}.prec strong{font-family:var(--mono);font-size:25px;font-weight:700;letter-spacing:.01em}
.lsv{border-top:1px solid var(--line);padding:10px 14px;display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--fg2);flex-wrap:wrap}
.lsv strong{color:var(--fg)}
.h2l{font-size:12px;font-weight:700;color:var(--fg2);text-transform:uppercase;letter-spacing:.08em}
.blank{background:var(--mark);color:#111827;border-radius:4px;padding:0 4px}
.copy{background:var(--btnSoft);color:var(--btnSoftT);font-size:12px;font-weight:700;border-radius:9px;padding:7px 12px;min-height:32px}
.hecho{font-size:15px;line-height:1.5;font-weight:600}
.money{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.money>div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.money span{font-size:11px;color:var(--fg2);font-weight:500}.money strong{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.kvl>div{padding:0 16px;min-height:46px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.kvl>div:last-child{border-bottom:0}
.kvl span{font-size:14px;color:var(--fg2);flex:none}.kvl b{font-size:14px;font-weight:700;text-align:right}
.yb{display:block;width:100%;background:var(--yel);color:var(--ink);border-radius:18px;padding:14px 16px}
.yb b{font-size:15px;display:flex;justify-content:space-between}
.yb div{font-size:13px;margin-top:4px;opacity:.85;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.notas{min-height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;width:100%}
.src{font-size:12px;color:var(--fg2);text-align:center}
.info{font-size:13.5px;border-left:3px solid var(--yel);padding-left:10px;line-height:1.5}
.note p{margin:0 0 10px;font-size:15px;line-height:1.55}.note h3{font-size:15px;margin:14px 0 8px}
.note ul{margin:0 0 10px;padding:0;list-style:none}.note li{padding-left:22px;position:relative;margin-bottom:6px;font-size:15px}.note li::before{content:"✔";position:absolute;left:0;color:var(--link);font-weight:700}
.note img{background:#fff;border-radius:8px;padding:6px;max-height:120px;margin:4px 6px 10px 0}
.tw{overflow-x:auto}table{border-collapse:collapse;font-size:13px;min-width:100%}td,th{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{background:var(--tile)}
.grados{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}
.grados div{background:var(--tile);border-radius:10px;padding:7px 8px}.grados b{display:block;font-size:12px}.grados span{font-size:11.5px;color:var(--fg2);font-variant-numeric:tabular-nums}
.big{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--seg);border-radius:10px;padding:2px;border:1px solid var(--line)}
.seg button{height:34px;border-radius:8px;font-size:13.5px;padding:0 2px;white-space:nowrap;font-weight:500;color:var(--fg2);text-align:center}
.seg button.on{background:var(--segOn);color:var(--fg);font-weight:700;box-shadow:0 1px 3px rgba(15,42,74,.15)}
.hero{height:170px;border-radius:16px;background:#fff center/contain no-repeat;border:1px solid var(--line)}
.p{font-size:15px;line-height:1.55;margin:0 0 10px}
.crumb{font-size:12.5px;color:var(--fg2)}
.lnk{display:flex;align-items:center;gap:8px;background:var(--tile);border-radius:12px;padding:10px 12px;width:100%}
.lnk .x{margin-left:auto;font-size:12.5px;color:var(--fg2);white-space:nowrap}

function tipoDe(text,esPdf,pags){const t=norm(text),ini=t.slice(0,350),re=/\b(sts|stc|stsj|sap|sentencia|tribunal supremo|audiencia provincial|tribunal constitucional|ecli|casacion|fundamentos? de derecho)\b/g,

function doSearch(v){rec(v);const cur=stack[stack.length-1];if(cur.v==='search'){cur.q=v;cur.f='';render()}else go({v:'search',q:v})}
const mkSeq=(t,a,b)=>{const o={v:a,id:b},ids=[...document.querySelectorAll('#app .row[data-go^="'+a+':"],#app .cv[data-go^="'+a+':"]')].map(x=>x.dataset.go.slice(a.length+1));if(ids.length>1&&ids.includes(b)){o.seq=ids;o.i=ids.indexOf(b)}return o};
function pager(){const c=stack[stack.length-1];let p=document.getElementById('pager');if(!c.seq){if(p)p.remove();return}if(!p){p=document.createElement('div');p.id='pager';document.body.appendChild(p)}p.innerHTML=`<button data-a="prv" aria-label="Anterior" ${c.i<1?'disabled':''}>‹</button><span>${c.i+1} / ${c.seq.length}</span><button data-a="nxt" aria-label="Siguiente" ${c.i>=c.seq.length-1?'disabled':''}>›</button>`}
function step(d){const c=stack[stack.length-1],j=c.i+d;if(!c.seq||j<0||j>=c.seq.length)return;const n={v:c.v,id:c.seq[j],seq:c.seq,i:j};recent(n);stack[stack.length-1]=n;render();window.scrollTo(0,0);try{$('#app').animate([{transform:`translateX(${d*36}px)`,opacity:.25},{transform:'none',opacity:1}],{duration:200,easing:'ease-out'})}catch(e){}}
let TS=null;
document.addEventListener('touchstart',e=>{if(e.touches.length!==1||e.target.closest('input,textarea,select,.lb')){TS=null;return}let el=e.target;while(el&&el!==document.body){if(el.scrollWidth>el.clientWidth+4&&/(auto|scroll)/.test(getComputedStyle(el).overflowX)){TS=null;return}el=el.parentElement}const t=e.touches[0];TS={x:t.clientX,y:t.clientY,t:Date.now()}},{passive:true});
document.addEventListener('touchend',e=>{if(!TS)return;const t=e.changedTouches[0],dx=t.clientX-TS.x,dy=t.clientY-TS.y,edge=TS.x<26,dt=Date.now()-TS.t;TS=null;if(dt>700||Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.8)return;if(edge&&dx>0){if(stack.length>1)back();return}if(stack[stack.length-1].seq)step(dx<0?1:-1)},{passive:true});
document.addEventListener('click',e=>{const x=e.target.closest('.lb .x');if(x){x.parentNode.remove();return}const l=e.target.closest('.lb');if(l){l.classList.toggle('z');return}const im=e.target.closest('.pgs img');if(im){const d=document.createElement('div');d.className='lb';d.innerHTML=`<img src="${im.src}" alt=""><button class="x" aria-label="Cerrar">×</button><div class="h">Toca para ampliar o reducir</div>`;document.body.appendChild(d)}});
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const cur=stack[stack.length-1];const d=t.dataset;
  if(d.a==='prv')return step(-1);if(d.editmine)return editMine(d.editmine);if(d.addarea!==undefined){ADD.area=d.addarea;return render()}if(d.a==='nxt')return step(1);if(d.a==='back')return back(); if(d.a==='clr'){const q=$('#q');q.value='';q.focus();return}
  if(d.a==='clrrec'){store.set('vd-recent',[]);toast('Recientes borrados');return render()}
  if(d.a==='go-q'){const q=$('#q');if(q.value.trim())doSearch(q.value);else q.focus();return}
  if(d.a==='notas')return toast('Mis notas llegan con Mi índice');
  if(d.tab)return tab(d.tab); if(d.fav)return toggleFav(d.fav); if(d.q){rec(d.q);return go({v:'search',q:d.q})}
  
  if(d.more){cur.lim=(cur.lim||40)+80;return render()}
  if(d.sf!==undefined){cur.f=d.sf;render();return window.scrollTo(0,0)}
  if(d.norma!==undefined){if(cur.v==='list'&&cur.b==='tr'){cur.n=d.norma;cur.lim=0;cur.m='';return render()}return go({v:'list',b:'tr',n:d.norma})}
  if(d.a==='expbk')return exportBk(); if(d.iv){store.set('vd-indview',d.iv);return render()} if(d.escreset){store.set('vd-escudo','');return render()} if(d.g!==undefined){cur.g=d.g;cur.lim=0;return render()} if(d.tog){const k='vd-'+d.tog;store.set(k,!store.get(k,true));return render()} if(d.fs){store.set('vd-fs',d.fs);document.documentElement.style.setProperty('--z',d.fs);return render()} if(d.cm){store.set('vd-copy',d.cm);return render()} if(d.a==='clrhist'){store.set('vd-hist',{});toast('Historial borrado');return render()} if(d.hov)return go({v:'hor',t:d.hov}); if(d.hp){cur.p=d.hp;return render()} if(d.addfc){ADD.fc=d.addfc;return render()} if(d.vadd){ADD.vin.push(d.vadd);const q=$('#vq').value;render();const n=$('#vq');if(n){n.value=q;vres(q)}return} if(d.vdel){ADD.vin=ADD.vin.filter(x=>x!==d.vdel);return render()} if(d.delmine){store.set('vd-mine',store.get('vd-mine',[]).filter(x=>x.id!==d.delmine));const i=LIB.findIndex(x=>x.id===d.delmine);if(i>-1)LIB.splice(i,1);delete BIM[d.delmine];const j=IDX.findIndex(x=>x.id===d.delmine);if(j>-1)IDX.splice(j,1);favs=favs.filter(k=>k!=='bi:'+d.delmine);store.set('vd-favs',favs);toast('Eliminado');return back()} if(d.a==='savemine')return saveMine(); if(d.ft!==undefined){cur.t=d.ft;return render()} if(d.at){cur.t=d.at;return render()} if(d.ag!==undefined){cur.g=d.ag;return render()}
  if(d.themeSet){store.set('vd-theme',d.themeSet);if(d.themeSet==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',d.themeSet);return render()}
  const g=d.go;if(!g)return;const[a,b]=g.split(':');
  if(a==='list')return go({v:'list',b}); if(a==='armas')return go({v:'armas'}); if(a==='ordl')return go({v:'ordl'}); if(a==='vmp')return go({v:'vmp'}); if(a==='prol')return go({v:'prol'}); go(mkSeq(t,a,b));
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.name){store.set('vd-name',t.value)}else if(t.dataset&&t.dataset.unid){store.set('vd-unidad',t.value)}else if(t.dataset&&t.dataset.add){ADD[t.dataset.add]=t.value}else if(t.id==='vq')vres(t.value);else if(t.id==='lf'){const c=stack[stack.length-1];c.t=t.value;c.lim=0;lfRefresh()}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.impbk&&t.files&&t.files[0]){importBk(t.files[0]);t.value=''}if(t.dataset&&t.dataset.impdat&&t.files&&t.files[0]){importDat(t.files[0]);t.value=''}if(t.dataset&&t.dataset.lm!==undefined){const c=stack[stack.length-1];c.m=t.value;c.lim=0;render()}
  if(t.dataset&&t.dataset.add==='area')ADD.area=t.value;
  if(t.dataset&&t.dataset.escf&&t.files&&t.files[0]){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,320/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);store.set('vd-escudo',c.toDataURL('image/png'));render()};im.src=r.result};r.readAsDataURL(t.files[0])}
  if(t.dataset&&t.dataset.addimg&&t.files&&t.files[0]){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{ADD.imgs=[jpg(cv2(im,im.width,im.height,960),.6)];render()};im.src=r.result};r.readAsDataURL(t.files[0])}if(t.dataset&&t.dataset.auto&&t.files&&t.files.length){const fl=[...t.files];t.value='';runAuto(fl)}});
document.documentElement.style.setProperty('--z',store.get('vd-fs','1'));
(function(){const th=store.get('vd-theme','auto');if(th!=='auto')document.documentElement.setAttribute('data-theme',th)})();
render();
API.onerr=()=>toast('No se pudo guardar en el teléfono');

}

const Boot=(()=>{
let db;const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('vademecum',1);r.onupgradeneeded=()=>{r.result.createObjectStore('kv');r.result.createObjectStore('datos')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const st=(s,m)=>db.transaction(s,m).objectStore(s);
const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const all=s=>new Promise((res,rej)=>{const o={},r=st(s,'readonly').openCursor();r.onsuccess=()=>{const c=r.result;if(c){o[c.key]=c.value;c.continue()}else res(o)};r.onerror=()=>rej(r.error)});
const API={KV:{},onerr:null,meta:'',
 put(s,k,v){req(st(s,'readwrite').put(v,k)).catch(()=>API.onerr&&API.onerr())},
 async putAll(o){const t=db.transaction('kv','readwrite'),s=t.objectStore('kv');for(const k in o)s.put(o[k],k);await new Promise((res,rej)=>{t.oncomplete=res;t.onerror=()=>rej(t.error)})},
 async putPack(o){await req(st('datos','readwrite').put({D:o.D,generado:o.generado||'',importado:new Date().toISOString()},'pack'))}};
const msg=(h)=>{document.getElementById('app').innerHTML=h;document.getElementById('nav').innerHTML=''};
function first(err){
 msg(`<div class="view col g16" style="padding-top:24px"><h1 class="h1">Vademécum</h1><p style="font-size:15px;line-height:1.55">Es la primera vez que se abre la app en este teléfono. Importa el archivo de datos que te entregó Claude (se llama <b>Vademecum_datos_….json</b>). Se guarda en el teléfono y no se envía a ningún sitio.</p>${err?`<p class="info">${err}</p>`:''}
 <label class="add" style="cursor:pointer"><span class="pl">+</span><span><b>Importar archivo de datos</b><span class="s">Elígelo desde Archivos o iCloud.</span></span><input type="file" accept=".json,application/json" id="f-dat" hidden></label>
 <label class="add" style="cursor:pointer"><span class="pl">↺</span><span><b>Importar una copia de seguridad</b><span class="s">Solo si ya tenías datos propios guardados.</span></span><input type="file" accept=".json,application/json" id="f-bk" hidden></label></div>`);
 document.getElementById('f-dat').onchange=async e=>{const f=e.target.files[0];if(!f)return;msg('<div class="view"><p class="ref" style="padding-top:40px">Importando datos…</p></div>');
  try{const o=JSON.parse(await f.text());if(o.vademecum!=='datos'||!o.D)throw 0;await API.putPack(o);location.reload()}catch(x){first('Ese archivo no es un paquete de datos de Vademécum.')}};
 document.getElementById('f-bk').onchange=async e=>{const f=e.target.files[0];if(!f)return;
  try{const o=JSON.parse(await f.text());if(o.vademecum!=='copia'||!o.kv)throw 0;await API.putAll(o.kv);API.KV=await all('kv');first('Copia importada. Ahora importa el archivo de datos.')}catch(x){first('Ese archivo no es una copia de Vademécum.')}}}
async function run(){
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
 try{db=await idb()}catch(e){return msg('<div class="view"><p class="info" style="margin-top:40px">Este navegador no permite guardar datos (¿navegación privada?). Abre la app desde Safari en una pestaña normal.</p></div>')}
 API.KV=await all('kv');const pack=await req(st('datos','readonly').get('pack'));
 if(!pack)return first('');
 API.meta=(pack.generado||'')?('paquete del '+new Date(pack.generado).toLocaleDateString('es-ES')):'cargados';
 start(pack.D,API)}
return{run}})();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
Boot.run();
</script>
